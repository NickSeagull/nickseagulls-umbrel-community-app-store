name: mctl-telegram Umbrel package check
on:
  pull_request:
    paths:
      - .github/workflows/mctl-package-check.yml
      - nickseagull-mctl-telegram/**
  workflow_dispatch:
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Check Compose and protected OAuth boot with synthetic credentials
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          cd nickseagull-mctl-telegram
          export APP_DATA_DIR="$tmp"
          export APP_NICKSEAGULL_MCTL_TELEGRAM_JWT_KEY="$(openssl rand -hex 32)"
          export APP_NICKSEAGULL_MCTL_TELEGRAM_ENCRYPTION_KEY="$(openssl rand -hex 32)"
          export APP_NICKSEAGULL_MCTL_TELEGRAM_DB_KEY="$(openssl rand -hex 32)"
          cat > "$tmp/check.yml" <<'YAML'
          services:
            app_proxy:
              image: busybox:1.37
            server:
              ports:
                - "127.0.0.1:18083:8080"
          YAML
          cat > "$tmp/settings.yml" <<'YAML'
          services:
            server:
              environment:
                TG_API_ID: "12345678"
                TG_API_HASH: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
                TELEGRAM_OIDC_CLIENT_ID: "12345678"
                TELEGRAM_OIDC_CLIENT_SECRET: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
                TG_LOGIN_CLIENTS: "12345678"
                PUBLIC_BASE_URL: "https://example.invalid"
                OAUTH_DCR_REDIRECT_URIS: "http://127.0.0.1:48500/callback"
          YAML
          base=(docker compose -f docker-compose.yml -f "$tmp/check.yml" -p mctl-umbrel-check)
          compose=(docker compose -f docker-compose.yml -f "$tmp/check.yml" -f "$tmp/settings.yml" -p mctl-umbrel-check)
          trap 'status=$?; if (( status )); then "${compose[@]}" ps -a || true; "${compose[@]}" logs --no-color --tail 60 server db || true; fi; "${compose[@]}" down --remove-orphans >/dev/null 2>&1 || true; sudo rm -rf "$tmp"; exit "$status"' EXIT
          "${base[@]}" config --format json > "$tmp/unconfigured.json"
          python3 - "$tmp/unconfigured.json" <<'PY'
          import json, re, sys
          from pathlib import Path
          app = json.load(open(sys.argv[1]))['services']['server']
          assert 'env_file' not in app
          required = {'TG_API_ID', 'TG_API_HASH', 'TELEGRAM_OIDC_CLIENT_ID',
                      'TELEGRAM_OIDC_CLIENT_SECRET', 'TG_LOGIN_CLIENTS'}
          for name in required:
              assert app['environment'][name] == '', name
          manifest = Path('umbrel-app.yml').read_text()
          exposed = set(re.findall(r'(?m)^  - name: ([A-Z_]+)\n    services: \[server\]$', manifest))
          assert required <= exposed, required - exposed
          for name in required:
              block = re.search(r'(?ms)^  - name: ' + name + r'\n(.*?)(?=^  - name:|^submitter:)', manifest)
              assert block and not re.search(r'(?m)^    default:', block.group(1)), name
          print('Unconfigured install needs no env file; five secrets are blank and listed in Umbrel settings')
          PY
          "${base[@]}" up -d db server
          sleep 3
          "${base[@]}" logs --no-color server > "$tmp/unconfigured.log"
          python3 - "$tmp/unconfigured.log" <<'PY'
          import sys
          assert 'TG_LOGIN_CLIENTS must list the owner Telegram ID' in open(sys.argv[1]).read()
          print('Unconfigured server refuses startup')
          PY
          if curl -fsS http://127.0.0.1:18083/healthz >/dev/null 2>&1; then
            echo 'Unconfigured server unexpectedly healthy' >&2
            exit 1
          fi
          "${compose[@]}" config --quiet
          "${compose[@]}" config --format json > "$tmp/resolved.json"
          python3 - "$tmp/resolved.json" <<'PY'
          import json, sys
          services = json.load(open(sys.argv[1]))['services']
          app = services['server']
          assert app['environment']['AUTH_MODE'] == 'local-jwt'
          assert app['environment']['AUTH_REQUIRED'] == 'true'
          assert app['environment']['ALLOW_SEND'] == 'false'
          assert app['environment']['MCP_TOOL_FILTER'] == 'read-only'
          assert app['environment']['DATABASE_URL'].startswith('postgres://mctl:')
          assert app['entrypoint'] == ['/bin/sh','-ec']
          assert len(app['command']) == 1 and 'exec /usr/local/bin/mctl-telegram' in app['command'][0]
          assert services['db']['image'].startswith('postgres:16-alpine@sha256:')
          assert not services['db'].get('ports')
          print('Compose read-only/auth/database contract passes')
          PY
          "${compose[@]}" up -d --force-recreate server
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:18083/healthz >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:18083/healthz >/dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18083/mcp)" = 401
          curl -fsS http://127.0.0.1:18083/.well-known/oauth-protected-resource/mcp > "$tmp/discovery.json"
          python3 - "$tmp/discovery.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          assert x['resource'] == 'https://example.invalid/mcp'
          print('Health, unauthorized MCP, and OAuth protected-resource discovery pass')
          PY
          curl -fsS -H 'Content-Type: application/json' \
            --data '{"client_name":"synthetic-ci","redirect_uris":["http://127.0.0.1:48500/callback"]}' \
            http://127.0.0.1:18083/oauth/register > "$tmp/client.json"
          python3 - "$tmp/client.json" "$tmp/client-id" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          assert x['client_id'].startswith('tgdcr_')
          open(sys.argv[2],'w').write(x['client_id'])
          print('Synthetic OAuth client registered')
          PY
          "${compose[@]}" restart server
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18083/healthz >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:18083/healthz >/dev/null
          python3 - "$tmp/client-id" <<'PY'
          import sys,urllib.request,urllib.error,urllib.parse
          client_id=open(sys.argv[1]).read()
          params={'client_id':client_id,'redirect_uri':'http://127.0.0.1:48500/callback','response_type':'code','code_challenge':'a'*43,'code_challenge_method':'S256','state':'synthetic-ci'}
          url='http://127.0.0.1:18083/oauth/authorize?'+urllib.parse.urlencode(params)
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs): return None
          opener=urllib.request.build_opener(NoRedirect)
          try: opener.open(url,timeout=8)
          except urllib.error.HTTPError as e:
              assert e.code == 302 and e.headers.get('Location','').startswith('https://oauth.telegram.org/'), f'authorization after restart: HTTP {e.code}'
          else: raise AssertionError('expected Telegram OIDC redirect')
          print('Dynamic OAuth registration survives server restart')
          PY
          python3 - "$tmp/settings.yml" <<'PY'
          import sys
          p=sys.argv[1]
          text=open(p).read()
          assert 'TG_LOGIN_CLIENTS: "12345678"' in text
          open(p,'w').write(text.replace('TG_LOGIN_CLIENTS: "12345678"','TG_LOGIN_CLIENTS: ""'))
          PY
          "${compose[@]}" up -d --force-recreate server
          sleep 3
          "${compose[@]}" logs --no-color server > "$tmp/guard.log"
          python3 - "$tmp/guard.log" <<'PY'
          import sys
          assert 'TG_LOGIN_CLIENTS must list the owner Telegram ID' in open(sys.argv[1]).read()
          print('Empty owner allowlist refuses startup')
          PY
          python3 - "$tmp/settings.yml" <<'PY'
          import sys
          p=sys.argv[1]
          text=open(p).read()
          assert 'TG_LOGIN_CLIENTS: ""' in text
          assert 'TELEGRAM_OIDC_CLIENT_SECRET: "' + 'a'*64 + '"' in text
          text=text.replace('TG_LOGIN_CLIENTS: ""','TG_LOGIN_CLIENTS: "12345678"')
          text=text.replace('TELEGRAM_OIDC_CLIENT_SECRET: "' + 'a'*64 + '"','TELEGRAM_OIDC_CLIENT_SECRET: ""')
          open(p,'w').write(text)
          PY
          "${compose[@]}" up -d --force-recreate server
          sleep 3
          "${compose[@]}" logs --no-color server > "$tmp/missing-oidc.log"
          python3 - "$tmp/missing-oidc.log" <<'PY'
          import sys
          assert 'Telegram API and OIDC settings must be configured' in open(sys.argv[1]).read()
          print('Missing OIDC credential refuses startup')
          PY
