name: mctl-telegram Umbrel image
on:
  push:
    branches:
      - feat/mctl-telegram-umbrel
    paths:
      - .github/workflows/mctl-telegram-image.yml
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: mctlhq/mctl-telegram
          ref: 47431f39eb153f99f6e7217ea2246cbb562cc623
          path: upstream
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache-dependency-path: upstream/go.sum
      - name: Test upstream
        working-directory: upstream
        run: go test ./...
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./upstream
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/nickseagull/mctl-telegram-umbrel:0.79.2-umbrel1
          provenance: true
          build-args: APP_VERSION=0.79.2
