name: Telegram MCP image
on:
  push:
    branches:
      - feat/telegram-mcp-umbrel
    paths:
      - nickseagull-telegram-mcp/image/**
      - .github/workflows/telegram-mcp-image.yml
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test wrapper
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.3'
          cache-dependency-path: nickseagull-telegram-mcp/image/go.sum
      - run: go test -race ./... && go vet ./...
        working-directory: nickseagull-telegram-mcp/image
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./nickseagull-telegram-mcp/image
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/nickseagull/telegram-mcp-umbrel:b57f47d-umbrel1
          provenance: true
