manifestVersion: 1
id: nickseagull-postiz
name: Postiz (RAMSYS)
category: social
version: "2.26.0"
tagline: Schedule posts across social channels
storage:
  dataRoot: data
description: >-
  Self-hosted social media scheduling with local media storage, PostgreSQL,
  Redis, and Temporal. Create an account in Postiz after installation;
  platform account integrations require separate setup and are not connected
  by installing this package. Umbrel login guards first-run registration;
  external social OAuth callbacks are not configured in this package.
releaseNotes: >-
  Initial Nick-owned package, pinned to Postiz 2.26.0. This release fixes
  access control in billing routes and cross-organization post saves, and
  includes prior security fixes through 2.25.3. A fresh install initializes
  the Postgres schema automatically; token encryption remains off by default.
developer: Postiz contributors
website: https://postiz.com/
repo: https://github.com/gitroomhq/postiz-app
support: https://github.com/gitroomhq/postiz-app/issues
submitter: NickSeagull
submission: https://github.com/NickSeagull/nickseagulls-umbrel-community-app-store/pulls
icon: https://raw.githubusercontent.com/dennysubke/dennys-umbrel-app-gallery/main/denny-postiz/logo.png
gallery: []
port: 4677
path: /auth
dependencies: []
