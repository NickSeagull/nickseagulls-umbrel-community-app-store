manifestVersion: 2.0
id: nickseagull-mctl-telegram
storage:
  dataRoot: data
category: developer
name: mctl Telegram
version: 0.79.2-umbrel4
tagline: Read your Telegram chats through an authenticated MCP server
requiresHttps: true
description: >-
  Self-hosted Telegram user-account MCP by mctlhq. This package filters the
  server's tools to read-only and disables real sends. Nick must provision
  Telegram API credentials, a BotFather OIDC login bot and a stable HTTPS
  hostname through Umbrel app settings after installation. The Telegram
  login bot authenticates the browser; a separate private phone/code/2FA flow
  connects the Telegram user session. Encrypted session state and OAuth client
  registrations live in movable Umbrel app data. Do not paste secrets into chats.
releaseNotes: >-
  Permit dynamic OAuth registration for Hermes' one exact HTTPS callback URI.
  The existing private proxy route forwards only that callback to Hermes;
  credentials, read-only safeguards and Telegram sessions remain unchanged.
developer: mctlhq
website: https://github.com/mctlhq/mctl-telegram
repo: https://github.com/NickSeagull/nickseagulls-umbrel-community-app-store
support: https://github.com/mctlhq/mctl-telegram/issues
dependencies: []
port: 4583
icon: https://raw.githubusercontent.com/NickSeagull/nickseagulls-umbrel-community-app-store/master/nickseagull-mctl-telegram/icon.svg
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
deterministicPassword: false
environment:
  - name: TG_API_ID
    services: [server]
    note: Telegram application ID from my.telegram.org/apps (numeric).
  - name: TG_API_HASH
    services: [server]
    note: Telegram application hash from my.telegram.org/apps. Umbrel settings inputs are not secret-masked.
  - name: TELEGRAM_OIDC_CLIENT_ID
    services: [server]
    note: BotFather Login Widget OIDC client ID.
  - name: TELEGRAM_OIDC_CLIENT_SECRET
    services: [server]
    note: BotFather Login Widget OIDC client secret. Umbrel settings inputs are not secret-masked.
  - name: TG_LOGIN_CLIENTS
    services: [server]
    note: Numeric Telegram user ID allowed to connect; required before server startup.
  - name: PUBLIC_BASE_URL
    services: [server]
    default: https://telegram-mcp.p.egregore.io
    note: Tailnet-only HTTPS origin for OAuth and MCP; do not change without re-registering the BotFather callback.
  - name: OAUTH_DCR_REDIRECT_URIS
    services: [server]
    default: https://telegram-mcp.p.egregore.io/api/mcp/oauth/callback/telegram
    note: Byte-exact allowlist for Hermes OAuth callback; change only if the private HTTPS callback route changes.
submitter: NickSeagull
submission: ""
