version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: nickseagull-mctl-telegram_server_1
      APP_PORT: 8080
      # The browser tile remains Umbrel-authenticated. The canonical OAuth
      # hostname is configured separately and must terminate HTTPS securely.
  server:
    image: ghcr.io/nickseagull/mctl-telegram-umbrel@sha256:d11870ea429c5d481dc8ff9cff46295401976beab934899202e52428bd796361
    restart: on-failure
    init: true
    user: "1000:1000"
    environment:
      # Fill these five values in Umbrel app Settings -> Environment
      # variables after installation; empty values fail closed at first boot.
      TG_API_ID: ""
      TG_API_HASH: ""
      TELEGRAM_OIDC_CLIENT_ID: ""
      TELEGRAM_OIDC_CLIENT_SECRET: ""
      TG_LOGIN_CLIENTS: ""
      PUBLIC_BASE_URL: "https://telegram-mcp.p.egregore.io"
      ADDR: ":8080"
      AUTH_MODE: local-jwt
      AUTH_REQUIRED: "true"
      # Byte-exact OAuth DCR exception for Hermes' dashboard callback only.
      # Umbrel App Settings can override this if the private HTTPS origin changes.
      OAUTH_DCR_REDIRECT_URIS: "https://telegram-mcp.p.egregore.io/api/mcp/oauth/callback/telegram"
      OAUTH_JWT_SIGNING_KEY: ${APP_NICKSEAGULL_MCTL_TELEGRAM_JWT_KEY}
      ENCRYPTION_KEY: ${APP_NICKSEAGULL_MCTL_TELEGRAM_ENCRYPTION_KEY}
      DATABASE_URL: "postgres://mctl:${APP_NICKSEAGULL_MCTL_TELEGRAM_DB_KEY}@db:5432/mctl?sslmode=disable"
      ALLOW_SEND: "false"
      MCP_TOOL_FILTER: read-only
      MCP_APPS_ENABLED: "false"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - 'test -n "$$TG_LOGIN_CLIENTS" || { printf "%s\n" "TG_LOGIN_CLIENTS must list the owner Telegram ID" >&2; exit 1; }; test -n "$$TG_API_ID" && test -n "$$TG_API_HASH" && test -n "$$TELEGRAM_OIDC_CLIENT_ID" && test -n "$$TELEGRAM_OIDC_CLIENT_SECRET" || { printf "%s\n" "Telegram API and OIDC settings must be configured" >&2; exit 1; }; exec /usr/local/bin/mctl-telegram'
    depends_on:
      db:
        condition: service_healthy
  tls_route:
    # Docker-only split-horizon route: keep the canonical HTTPS/SNI/OAuth
    # hostname, pass TLS unchanged to the existing NPM proxy host. No host port.
    image: haproxy:3.2-alpine@sha256:5d97434a423c2533cfeb42874d45cf6d69a840b60334582dfbfd5008e94c80be
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    volumes:
      - ${APP_DATA_DIR}/hooks/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      default:
        aliases:
          - telegram-mcp.p.egregore.io
  db:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    restart: unless-stopped
    environment:
      POSTGRES_USER: mctl
      POSTGRES_PASSWORD: ${APP_NICKSEAGULL_MCTL_TELEGRAM_DB_KEY}
      POSTGRES_DB: mctl
    volumes:
      - ${APP_DATA_DIR}/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mctl -d mctl"]
      interval: 5s
      timeout: 5s
      retries: 10
