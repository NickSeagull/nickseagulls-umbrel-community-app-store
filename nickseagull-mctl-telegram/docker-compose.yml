version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: nickseagull-mctl-telegram_server_1
      APP_PORT: 8080
      # The browser tile remains Umbrel-authenticated. The canonical OAuth
      # hostname is configured separately and must terminate HTTPS securely.
  server:
    image: ghcr.io/nickseagull/mctl-telegram-umbrel:0.79.2-umbrel1
    restart: on-failure
    init: true
    user: "1000:1000"
    env_file:
      - ${APP_DATA_DIR}/mctl.env
    environment:
      ADDR: ":8080"
      AUTH_MODE: local-jwt
      AUTH_REQUIRED: "true"
      OAUTH_JWT_SIGNING_KEY: ${APP_NICKSEAGULL_MCTL_TELEGRAM_JWT_KEY}
      ENCRYPTION_KEY: ${APP_NICKSEAGULL_MCTL_TELEGRAM_ENCRYPTION_KEY}
      DATABASE_URL: "file:/data/mctl.db?_pragma=journal_mode(WAL)&_pragma=busy_timeout(5000)"
      ALLOW_SEND: "false"
      MCP_TOOL_FILTER: read-only
      MCP_APPS_ENABLED: "false"
    volumes:
      - ${APP_DATA_DIR}/data/state:/data
