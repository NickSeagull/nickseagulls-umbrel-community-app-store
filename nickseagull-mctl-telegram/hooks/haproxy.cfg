global
  log stdout format raw local0

defaults
  log global
  mode tcp
  timeout connect 5s
  timeout client 1h
  timeout server 1h

resolvers docker_dns
  nameserver dns 127.0.0.11:53
  resolve_retries 3
  timeout resolve 1s
  hold valid 10s

frontend telegram_https
  bind *:443
  default_backend npm_tls

backend npm_tls
  server npm nginx-proxy-manager_web_1:443 check inter 10s resolvers docker_dns init-addr libc,none
