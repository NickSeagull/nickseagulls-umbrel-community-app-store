manifestVersion: 1
id: nickseagull-chromium
name: Chromium for RAMSYS
tagline: A persistent browser with visual login and CDP control
icon: https://raw.githubusercontent.com/NickSeagull/nickseagulls-umbrel-community-app-store/master/nickseagull-chromium/icon.svg
category: networking
version: "26.09.4"
port: 4580
description: >-
  EXPERIMENTAL APP-START TEST — do not sign in to GitHub, Gmail, or other real
  accounts yet. An unsigned-in direct Docker probe passed Chromium's sandbox
  self-check and persisted a harmless cookie across restart without SYS_ADMIN;
  the Umbrel app-managed startup and update path have not been verified. This
  app loads a browser-specific AppArmor policy on the host before startup,
  requires that policy and seccomp in the container, and uses a persistent
  /config profile shared by visual browsing and CDP. Web terminal and file
  manager are disabled.
developer: jlesage
website: https://github.com/jlesage/docker-chromium
submitter: NickSeagull
repo: https://github.com/jlesage/docker-chromium
support: https://github.com/jlesage/docker-chromium/issues
releaseNotes: >-
  Experimental app-managed sandbox test: load a Docker-default-derived,
  Chromium-specific AppArmor profile before Compose and require it in enforce
  mode. Add scoped seccomp exceptions for Chromium's user and PID namespaces,
  remove CAP_SYS_ADMIN, and replace the pinned image's unsandboxed launcher
  fallback with a fail-closed variant. An unsigned-in direct Docker trial passed
  the sandbox self-check and profile restart test; Umbrel install/update has
  not been verified. Do not sign in to real accounts yet.
dependencies: []
path: ""
defaultUsername: ""
defaultPassword: ""
