manifestVersion: 1
id: nickseagull-matter-hub
storage:
  dataRoot: data
category: automation
name: Home Assistant Matter Hub
version: "2.0.58"
tagline: Expose selected Home Assistant entities to Google Home over Matter
description: >-
  The maintained RiDDiX fork bridges Home Assistant entities to Google Home,
  Apple Home and other Matter controllers over the local network. It is not
  the Matter Server controller for importing devices into Home Assistant.
  Requires a Google Matter hub, working LAN IPv6/mDNS and an HA long-lived
  access token. Provision ha.env with HAMH_HOME_ASSISTANT_ACCESS_TOKEN
  before installing in the app's fixed directory (see this store's README).
  Its host-networked web UI uses HTTP Basic authentication with Umbrel's
  generated app password.
developer: RiDDiX and Home Assistant Matter Hub contributors
website: https://riddix.github.io/home-assistant-matter-hub/
repo: https://github.com/RiDDiX/home-assistant-matter-hub
support: https://github.com/RiDDiX/home-assistant-matter-hub/issues
dependencies:
  - home-assistant
port: 8482
icon: https://raw.githubusercontent.com/NickSeagull/nickseagulls-umbrel-community-app-store/master/nickseagull-matter-hub/icon.svg
gallery: []
path: ""
defaultUsername: admin
defaultPassword: ""
deterministicPassword: true
releaseNotes: "Initial package of maintained Matter Hub v2.0.58."
submitter: NickSeagull
submission: https://github.com/NickSeagull/nickseagulls-umbrel-community-app-store/pull/7
